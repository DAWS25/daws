# export REPOSITORY_NAME=project-app
# aws cloudformation deploy --stack-name ecr-$REPOSITORY_NAME --template-file cloudformation/ecr-public.cform.yaml --parameter-overrides RepositoryName=$REPOSITORY_NAME
# aws cloudformation delete-stack --stack-name ecr-$REPOSITORY_NAME
Description: Public ECR Repository

Parameters:
  RepositoryName:
    Type: String
    Description: Name of the public ECR repository

Resources:
  PublicRepository:
    Type: AWS::ECR::PublicRepository
    Properties:
      RepositoryName: !Ref RepositoryName

Outputs:
  RepositoryArn:
    Description: ARN of the public ECR repository
    Value: !GetAtt PublicRepository.Arn
    Export:
      Name: !Sub "${RepositoryName}-RepositoryArn"
